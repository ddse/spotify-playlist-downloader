services:
  web:
    env_file:
      - .env
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:8080"
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      DB_PATH: /state/app.db
      MUSIC_DIR: /music
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-}
      SYNC_TOKEN: ${SYNC_TOKEN:-}
      DEBUG: ${DEBUG:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKER_ENDPOINT: http://worker:8090
    depends_on:
      worker:
        condition: service_started
    volumes:
      - ${MUSIC_DIR:-./music}:/music
      - ./state:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    env_file:
      - .env
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    # Temporary test mode: wg-quick needs kernel networking/sysctl access.
    # Reduce privileges after WireGuard routing is confirmed.
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      DB_PATH: /state/app.db
      MUSIC_DIR: /music
      AUDIO_FORMAT: ${AUDIO_FORMAT:-mp3}
      AUDIO_BITRATE: ${AUDIO_BITRATE:-320k}
      WORKER_SERVICE_NAME: worker
      DEBUG: ${DEBUG:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${MUSIC_DIR:-./music}:/music
      - ./state:/state
      - /lib/modules:/lib/modules:ro
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3).read(); import sqlite3,time; c=sqlite3.connect('/state/app.db'); r=c.execute(\"select heartbeat from service_heartbeat where service='worker'\").fetchone(); assert r and time.time()-r[0] < 30"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  scheduler:
    env_file:
      - .env
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: ["python", "scheduler.py"]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      DB_PATH: /state/app.db
      SYNC_ENDPOINT: http://web:8080
      SYNC_TOKEN: ${SYNC_TOKEN:-}
      DEBUG: ${DEBUG:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-30}
    volumes:
      - ./state:/state
    depends_on:
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3,time; c=sqlite3.connect('/state/app.db'); r=c.execute(\"select heartbeat from service_heartbeat where service='scheduler'\").fetchone(); assert r and time.time()-r[0] < 30"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

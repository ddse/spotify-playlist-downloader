services:
  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:8080"
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      DB_PATH: /state/app.db
      MUSIC_DIR: /music
      METUBE_URL: http://metube:8081
      METUBE_PUBLIC_URL: ${METUBE_PUBLIC_URL:-http://localhost:8081}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI}
      SYNC_TOKEN: ${SYNC_TOKEN}
    volumes:
      - ${MUSIC_DIR}:/music
      - ./state:/state
    depends_on:
      metube:
        condition: service_healthy
      worker:
        condition: service_healthy
      scheduler:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build: ./worker
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      DB_PATH: /state/app.db
      MUSIC_DIR: /music
      AUDIO_FORMAT: ${AUDIO_FORMAT:-mp3}
      AUDIO_BITRATE: ${AUDIO_BITRATE:-320k}
    volumes:
      - ${MUSIC_DIR}:/music
      - ./state:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3,time; c=sqlite3.connect('/state/app.db'); r=c.execute(\"select heartbeat from service_heartbeat where service='worker'\").fetchone(); assert r and time.time()-r[0] < 30"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  scheduler:
    build: ./worker
    command: ["python", "scheduler.py"]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      DB_PATH: /state/app.db
      SYNC_ENDPOINT: http://web:8080
      SYNC_TOKEN: ${SYNC_TOKEN}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-30}
    volumes:
      - ./state:/state
    depends_on:
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3,time; c=sqlite3.connect('/state/app.db'); r=c.execute(\"select heartbeat from service_heartbeat where service='scheduler'\").fetchone(); assert r and time.time()-r[0] < 30"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  metube:
    image: ghcr.io/alexta69/metube:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      DOWNLOAD_DIR: /downloads
    ports:
      - "${METUBE_PORT:-8081}:8081"
    volumes:
      - ${MUSIC_DIR}:/downloads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/', timeout=3).read(64)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

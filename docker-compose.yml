services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:8080"
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      DB_PATH: /state/app.db
      MUSIC_DIR: /music
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI}
      SYNC_TOKEN: ${SYNC_TOKEN}
      WORKER_ENDPOINT: http://worker-normal:8090
      WORKER_VPN_ENDPOINT: http://wireguard:8090
    depends_on:
      worker-normal:
        condition: service_started
      worker-vpn:
        condition: service_started
    volumes:
      - ${MUSIC_DIR}:/music
      - ./state:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker-normal:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      DB_PATH: /state/app.db
      MUSIC_DIR: /music
      AUDIO_FORMAT: ${AUDIO_FORMAT:-mp3}
      AUDIO_BITRATE: ${AUDIO_BITRATE:-320k}
      WORKER_SERVICE_NAME: worker
      ROUTE_WIREGUARD: "0"
    volumes:
      - ${MUSIC_DIR}:/music
      - ./state:/state
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3).read(); import sqlite3,time; c=sqlite3.connect('/state/app.db'); r=c.execute(\"select heartbeat from service_heartbeat where service='worker'\").fetchone(); assert r and time.time()-r[0] < 30"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  scheduler:
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: ["python", "scheduler.py"]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      DB_PATH: /state/app.db
      SYNC_ENDPOINT: http://web:8080
      SYNC_TOKEN: ${SYNC_TOKEN}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-30}
    volumes:
      - ./state:/state
    depends_on:
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3,time; c=sqlite3.connect('/state/app.db'); r=c.execute(\"select heartbeat from service_heartbeat where service='scheduler'\").fetchone(); assert r and time.time()-r[0] < 30"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./wireguard:/config
      - /lib/modules:/lib/modules:ro
    healthcheck:
      test: ["CMD-SHELL", "test -e /sys/class/net/wg0 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker-vpn:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    network_mode: "service:wireguard"
    depends_on:
      wireguard:
        condition: service_started
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      DB_PATH: /state/app.db
      MUSIC_DIR: /music
      AUDIO_FORMAT: ${AUDIO_FORMAT:-mp3}
      AUDIO_BITRATE: ${AUDIO_BITRATE:-320k}
      WORKER_SERVICE_NAME: worker-vpn
      ROUTE_WIREGUARD: "1"
    volumes:
      - ${MUSIC_DIR}:/music
      - ./state:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3).read(); import sqlite3,time; c=sqlite3.connect('/state/app.db'); r=c.execute(\"select heartbeat from service_heartbeat where service='worker-vpn'\").fetchone(); assert r and time.time()-r[0] < 30"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

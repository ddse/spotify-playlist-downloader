<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spotify Downloader v2</title><style>body{font-family:system-ui;max-width:1100px;margin:auto;padding:18px;background:#111;color:#eee}input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #444}input{background:#1b1b1b;color:#fff;width:min(650px,100%)}button{cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}.card{padding:12px;margin:8px 0;background:#1b1b1b;border-radius:10px}.track{display:flex;gap:12px;align-items:center}.track img{width:56px;height:56px;object-fit:cover}.meta{flex:1}.muted{color:#aaa}.bar{height:8px;background:#444;border-radius:5px;margin-top:7px}.fill{height:100%;background:#aaa;border-radius:5px}.section{margin-top:28px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#333;margin:2px}.online{background:#244d2b}.offline{background:#512525}.tabs button{margin-right:5px}.hidden{display:none}pre{white-space:pre-wrap;max-height:180px;overflow:auto}</style></head><body><h1>Spotify Downloader v2</h1><div class="row"><a href="/api/spotify/login"><button>Spotify Login / Connect</button></a><a href="/metube"><button>MeTube</button></a><span id="services"></span></div><div class="section"><div class="row"><input id="q" placeholder="曲名 / アーティスト / アルバム"><button onclick="search()">検索</button></div><div id="results"></div></div><div class="section"><h2>Playlist Management</h2><form class="row" method="post" action="/api/playlists"><input name="url" placeholder="Spotify playlist URL" required><button>Add Playlist</button></form><div id="playlists"></div></div><div class="section"><div class="tabs"><button onclick="showTab('queue')">Queue</button><button onclick="showTab('history')">Download History</button></div><div id="queue"></div><div id="history" class="hidden"></div></div><script>
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}
async function search(){let q=document.getElementById('q').value,r=await fetch('/api/search?q='+encodeURIComponent(q)),d=await r.json(),b=document.getElementById('results');b.innerHTML=d.error||'';for(const x of d.items||[]){let e=document.createElement('div');e.className='card track';e.innerHTML=(x.image?`<img src="${esc(x.image)}">`:'')+`<div class="meta"><b>${esc(x.title)}</b><br>${esc(x.artists)} · ${esc(x.album)}</div><form method="post" action="/api/download"><input type="hidden" name="spotify_id" value="${esc(x.id)}"><input type="hidden" name="title" value="${esc(x.title)}"><input type="hidden" name="artists" value="${esc(x.artists)}"><input type="hidden" name="album" value="${esc(x.album)}"><input type="hidden" name="url" value="${esc(x.url)}"><button>Download</button></form>`;b.appendChild(e)}}
async function loadPlaylists(){let d=await (await fetch('/api/health')).json();let p=await fetch('/');let box=document.getElementById('playlists');box.innerHTML='';let html=`<p class="muted">Use the forms above to add playlists. Playlist controls refresh with the page.</p>`;box.innerHTML=html}
async function sync(id){let token=prompt('SYNC_TOKEN');if(!token)return;let r=await fetch('/api/playlists/'+id+'/sync',{method:'POST',headers:{'X-Sync-Token':token}});let d=await r.json();alert(d.ok?'Added '+d.added+' / '+d.total+' tracks':d.error);load()}
async function load(){let d=await (await fetch('/api/jobs')).json(),b=document.getElementById('queue');b.innerHTML='';for(const x of d.items){let actions=x.status==='failed'?`<button onclick="retry('${x.spotify_id}')">Retry</button>`:(x.status==='queued'||x.status==='failed'?`<button onclick="del('${x.spotify_id}')">Delete</button>`:'');let e=document.createElement('div');e.className='card';e.innerHTML=`<b>${esc(x.title)}</b> · ${esc(x.artists)}<br><span class="pill">${esc(x.status)}</span> ${x.progress}%<div class="bar"><div class="fill" style="width:${x.progress}%"></div></div>${actions}${x.error?`<details><summary>Error</summary><pre>${esc(x.error)}</pre></details>`:''}`;b.appendChild(e)}let h=await (await fetch('/api/history')).json(),hb=document.getElementById('history');hb.innerHTML=h.items.map(x=>`<div class="card"><b>${esc(x.title)}</b> · ${esc(x.artists)}<br><span class="muted">${esc(x.status)} · ${esc(x.updated_at||'')}</span>${x.error?`<details><summary>Error</summary><pre>${esc(x.error)}</pre></details>`:''}</div>`).join('')||'<p class="muted">No history.</p>';let s=await (await fetch('/api/services')).json();document.getElementById('services').innerHTML=`<span class="pill ${s.worker.status==='online'?'online':'offline'}">worker: ${s.worker.status}</span><span class="pill ${s.scheduler.status==='online'?'online':'offline'}">scheduler: ${s.scheduler.status}</span>`}
async function retry(id){await fetch('/api/retry/'+id,{method:'POST'});load()}async function del(id){if(!confirm('Delete this queue item?'))return;await fetch('/api/queue/'+id,{method:'DELETE'});load()}function showTab(x){document.getElementById('queue').classList.toggle('hidden',x!=='queue');document.getElementById('history').classList.toggle('hidden',x!=='history')}load();setInterval(load,3000);
</script></body></html>

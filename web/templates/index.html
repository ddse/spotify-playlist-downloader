<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spotify Downloader v2</title><style>body{font-family:system-ui;max-width:1100px;margin:auto;padding:18px;background:#111;color:#eee}input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #444}input{background:#1b1b1b;color:#fff;width:min(650px,100%)}button{cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}.card{padding:12px;margin:8px 0;background:#1b1b1b;border-radius:10px}.track{display:flex;gap:12px;align-items:center}.track img{width:56px;height:56px;object-fit:cover}.meta{flex:1}.muted{color:#aaa}.bar{height:7px;background:#444;border-radius:5px;margin-top:7px}.fill{height:100%;background:#aaa;border-radius:5px}.section{margin-top:28px}</style></head><body><h1>Spotify Downloader v2</h1><div class="row"><a href="/api/spotify/login"><button>Spotify Login / Connect</button></a><a href="/metube"><button>MeTube</button></a></div><div class="section"><div class="row"><input id="q" placeholder="曲名 / アーティスト / アルバム"><button onclick="search()">検索</button></div><div id="results"></div></div><div class="section"><h2>Private / Public Playlist</h2><form class="row" method="post" action="/api/playlists"><input name="url" placeholder="Spotify playlist URL" required><button>Add Playlist</button></form>{% for p in playlists %}<div class="card"><b>{{p['name']}}</b><br><span class="muted">{{p['url']}} · last sync: {{p['last_sync'] or 'never'}}</span><br><button onclick="sync('{{p['spotify_id']}}')">Sync now</button></div>{% endfor %}</div><div class="section"><h2>Queue / Progress</h2><div id="jobs"></div></div><script>
async function search(){let q=document.getElementById('q').value,r=await fetch('/api/search?q='+encodeURIComponent(q)),d=await r.json(),b=document.getElementById('results');b.innerHTML=d.error||'';for(const x of d.items||[]){let e=document.createElement('div');e.className='card track';e.innerHTML=(x.image?`<img src="${esc(x.image)}">`:'')+`<div class="meta"><b>${esc(x.title)}</b><br>${esc(x.artists)} · ${esc(x.album)}</div><form method="post" action="/api/download"><input type="hidden" name="spotify_id" value="${esc(x.id)}"><input type="hidden" name="title" value="${esc(x.title)}"><input type="hidden" name="artists" value="${esc(x.artists)}"><input type="hidden" name="album" value="${esc(x.album)}"><input type="hidden" name="url" value="${esc(x.url)}"><button>Download</button></form>`;b.appendChild(e)}}
async function sync(id){let r=await fetch('/api/playlists/'+id+'/sync',{method:'POST'});let d=await r.json();alert(d.ok?'Added '+d.added+' tracks':d.error);load()};async function retry(id){await fetch('/api/retry/'+id,{method:'POST'});load()};async function load(){let d=await (await fetch('/api/jobs')).json(),b=document.getElementById('jobs');b.innerHTML='';for(const x of d.items){let e=document.createElement('div');e.className='card';e.innerHTML=`<b>${esc(x.title)}</b> · ${esc(x.artists)}<br><span class="muted">${x.status} ${x.progress}%</span><div class="bar"><div class="fill" style="width:${x.progress}%"></div></div>${x.error?`<details><summary>Error</summary><pre>${esc(x.error)}</pre></details>`:''}${x.status==='failed'?`<button onclick="retry('${x.spotify_id}')">Retry</button>`:''}`;b.appendChild(e)}}function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}load();setInterval(load,3000);
</script></body></html>

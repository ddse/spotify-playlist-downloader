<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Downloader</title>
<style>
body{font-family:system-ui;max-width:1280px;margin:auto;padding:18px;background:#111;color:#eee}
input,select,button{font:inherit;padding:9px;border-radius:7px;border:1px solid #444}
input,select{background:#1b1b1b;color:#fff}button{background:#222;color:#eee;cursor:pointer}
button:hover{background:#333}.row{display:flex;gap:8px;flex-wrap:wrap}.card{padding:12px;margin:8px 0;background:#1b1b1b;border-radius:10px}
.track{display:flex;gap:12px;align-items:flex-start}.track img{width:72px;height:72px;object-fit:cover;border-radius:6px}.meta{flex:1}.muted{color:#aaa}
.section{margin-top:26px}.tabs{display:flex;gap:4px;border-bottom:1px solid #333;margin-top:28px}
.tab{background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;color:#aaa}.tab.active{color:#fff;border-bottom-color:#fff}
.panel{display:none}.panel.active{display:block}.toolbar{display:flex;gap:18px;align-items:center;padding:10px 6px;border-bottom:1px solid #333;flex-wrap:wrap}
.toolbar button{background:transparent;border:0;color:#aaa;padding:3px}.toolbar button:hover{color:#fff}.selectall{margin-left:auto;color:#aaa}
.table{width:100%;overflow-x:auto}.head,.item{display:grid;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #292929;min-width:900px}
.head{color:#aaa;font-size:.85em}.queue .head,.queue .item{grid-template-columns:34px minmax(250px,2fr) 80px minmax(180px,1fr) minmax(170px,1fr) 210px}
.completed .head,.completed .item{grid-template-columns:34px minmax(250px,2fr) 80px minmax(180px,1fr) 110px 150px 180px}
.progress{height:8px;background:#444;border-radius:5px;overflow:hidden}.fill{height:100%;background:#aaa}
.actions{display:flex;gap:6px;flex-wrap:wrap}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#333;margin:2px}
.online{background:#244d2b}.offline,.failed{background:#512525}.speed{font-family:ui-monospace,monospace}.error{color:#ff9b9b}
.downloadbox{background:#161616;border:1px solid #333;border-radius:8px;padding:10px;margin-top:8px}
.downloadbox form{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.downloadbox label{display:flex;flex-direction:column;gap:4px;font-size:.82em;color:#aaa}
.hidden{display:none}.subscription{display:grid;grid-template-columns:34px minmax(250px,2fr) 100px 170px 250px;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #292929}
pre{white-space:pre-wrap;max-height:240px;overflow:auto}.barlabel{display:flex;justify-content:space-between}
</style>
</head>
<body>
<h1>Music Downloader</h1>

<div class="row">
<a href="/api/spotify/login"><button>Spotify Login / Connect</button></a>
<span id="services"></span>
</div>

<div class="section">
<h2>Search</h2>
<div class="row">
<input id="q" placeholder="Song / artist / album" style="width:min(700px,100%)">
<button onclick="searchSpotify()">Spotify</button>
<button onclick="searchYoutube(document.getElementById('q').value,1)">YouTube</button>
</div>
<div id="results"></div><div id="youtubePagination" class="actions"></div>
</div>

<div class="section">
<h2>YouTube Playlist / Channel</h2>
<form class="row" method="post" action="/api/import/youtube">
<input name="source_url" placeholder="YouTube playlist or channel URL" required style="min-width:360px">
<select name="source_mode"><option value="playlist">Playlist</option><option value="channel">Channel</option></select>
<select name="download_type"><option value="audio">Audio</option><option value="video">Video</option></select>
<select name="download_format"><option value="mp3">MP3</option><option value="m4a">M4A</option><option value="opus">Opus</option><option value="mp4">MP4</option></select>
<select name="download_quality"><option value="best">Best</option><option value="320">320 kbps</option><option value="1080">1080p</option><option value="720">720p</option></select>
<input name="download_folder" value="YouTube" placeholder="Output folder">
<input name="playlist_item_limit" type="number" min="0" max="5000" value="0" title="0 = all">
<button>Queue import</button>
</form>
</div>

<div class="section">
<h2>Spotify Playlists</h2>
<form class="row" method="post" action="/api/playlists">
<input name="url" placeholder="Spotify playlist URL" required style="min-width:360px"><button>Add Playlist</button>
</form>
<div id="playlists"></div>
</div>

<div class="tabs">
<button class="tab active" onclick="showTab('downloading',this)">Downloading <span id="downloadingCount"></span></button>
<button class="tab" onclick="showTab('completed',this)">Completed <span id="completedCount"></span></button>
<button class="tab" onclick="showTab('subscriptions',this)">Subscriptions <span id="subscriptionsCount"></span></button>
</div>

<section id="downloading" class="panel active queue">
<div class="toolbar">
<button onclick="bulkQueue('clear_selected')">🗑 Cancel selected</button>
<button onclick="bulkQueue('download_selected')">⇩ Download selected</button>
<label class="selectall"><input type="checkbox" id="selectAllQueue" onchange="toggleQueue(this.checked)"> Select all</label>
<span id="queueSelected">0 selected</span>
</div>
<div class="table">
<div class="head"><div></div><div>Video</div><div>Type</div><div>Quality / Codec / Format</div><div>Progress</div><div>Actions</div></div>
<div id="queue"></div>
</div>
</section>

<section id="completed" class="panel completed">
<div class="toolbar">
<button onclick="sortCompleted()">↕ Oldest first</button>
<button onclick="bulkCompleted('clear_selected')">🗑 Clear selected</button>
<button onclick="bulkCompleted('clear_completed')">✓ Clear completed</button>
<button onclick="bulkCompleted('clear_failed')">✕ Clear failed</button>
<button onclick="bulkCompleted('retry_failed')">↻ Retry failed</button>
<button onclick="bulkCompleted('download_selected')">⇩ Download selected</button>
<label class="selectall"><input type="checkbox" id="selectAllCompleted" onchange="toggleCompleted(this.checked)"> Select all</label>
<span id="completedSelected">0 selected</span>
</div>
<div class="table">
<div class="head"><div></div><div>Video</div><div>Type</div><div>Quality / Codec / Format</div><div>File Size</div><div>Downloaded</div><div>Actions</div></div>
<div id="history"></div>
</div>
</section>

<section id="subscriptions" class="panel">
<div class="toolbar">
<button onclick="checkAllSubscriptions()">↻ Check all now</button>
<button onclick="checkSelectedSubscriptions()">↻ Check selected</button>
<button onclick="deleteSelectedSubscriptions()">🗑 Delete selected</button>
<label class="selectall"><input type="checkbox" id="selectAllSubscriptions" onchange="toggleSubscriptions(this.checked)"> Select all</label>
</div>
<div id="subscriptionsPanel"></div>
</section>

<script>
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function dur(s){if(!s)return '';s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function fmtBytes(n){n=Number(n||0);if(!n)return '—';const u=['B','KiB','MiB','GiB'];let i=0;while(n>=1024&&i<3){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]}
function showTab(id,btn){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');btn.classList.add('active')}

async function searchSpotify(){
 const q=document.getElementById('q').value.trim();if(!q)return;
 const d=await (await fetch('/api/search/spotify?q='+encodeURIComponent(q))).json();
 const b=document.getElementById('results');b.innerHTML='<h3>Spotify metadata</h3>';
 if(d.error){b.innerHTML+='<div class="error">'+esc(d.error)+'</div>';return}
 for(const x of d.items||[]){
  const e=document.createElement('div');e.className='card track';
  e.innerHTML=(x.image?'<img src="'+esc(x.image)+'">':'')+'<div class="meta"><b>'+esc(x.title)+'</b><br>'+esc(x.artists)+' · '+esc(x.album)+'</div><button>Find YouTube</button>';
  e.querySelector('button').onclick=()=>searchYoutube(x.title+' '+x.artists,1);b.appendChild(e);
 }
}

function optionForm(x){
 return '<details class="downloadbox"><summary>Download options</summary>'+
 '<form method="post" action="/api/download">'+
 '<input type="hidden" name="source_url" value="'+esc(x.url)+'"><input type="hidden" name="youtube_id" value="'+esc(x.id)+'"><input type="hidden" name="title" value="'+esc(x.title)+'"><input type="hidden" name="artists" value="'+esc(x.channel)+'">'+
 '<label>Type<select name="download_type" onchange="syncOptions(this)"><option value="audio">Audio</option><option value="video">Video</option></select></label>'+
 '<label class="audio-opt">Format<select name="download_format"><option value="mp3">MP3</option><option value="m4a">M4A</option><option value="opus">Opus</option><option value="wav">WAV</option><option value="flac">FLAC</option></select></label>'+
 '<label class="audio-opt">Quality<select name="download_quality"><option value="320">320 kbps</option><option value="256">256 kbps</option><option value="192">192 kbps</option><option value="128">128 kbps</option><option value="best">Best</option></select></label>'+
 '<label class="video-opt hidden">Format<select name="download_format"><option value="any">Any</option><option value="mp4">MP4</option><option value="ios">iOS</option></select></label>'+
 '<label class="video-opt hidden">Quality<select name="download_quality"><option value="best">Best</option><option>2160</option><option>1440</option><option>1080</option><option>720</option><option>480</option><option>360</option></select></label>'+
 '<label class="video-opt hidden">Codec<select name="video_codec"><option value="auto">Auto</option><option value="h264">H.264</option><option value="h265">H.265</option><option value="av1">AV1</option><option value="vp9">VP9</option></select></label>'+
 '<label>Folder<select name="download_folder"><option value="">Artist / Album</option><option value="Music">Music</option><option value="YouTube">YouTube</option><option value="Videos">Videos</option></select></label>'+
 '<label>Thumbnail<input type="checkbox" name="thumbnail" value="1" checked></label>'+
 '<label class="video-opt hidden">Subtitle<input type="checkbox" name="subtitle" value="1"></label>'+
 '<label class="video-opt hidden">Subtitle lang<input name="subtitle_lang" value="ja,en" size="9"></label>'+
 '<label class="video-opt hidden">Subtitle mode<select name="subtitle_mode"><option value="prefer_manual">Manual preferred</option><option value="prefer_auto">Auto preferred</option><option value="manual_only">Manual only</option><option value="auto_only">Auto only</option></select></label>'+
 '<label class="video-opt hidden">Split chapters<input type="checkbox" name="split_chapters" value="1"></label>'+
 '<label>Start<select name="auto_start"><option value="1">Now</option><option value="0">Pause</option></select></label>'+
 '<button>Download</button></form></details>';
}
function syncOptions(sel){
 const f=sel.closest('form');f.querySelectorAll('.audio-opt').forEach(e=>{e.classList.toggle('hidden',sel.value!=='audio');e.querySelectorAll('select,input').forEach(x=>x.disabled=sel.value!=='audio')});
 f.querySelectorAll('.video-opt').forEach(e=>{e.classList.toggle('hidden',sel.value!=='video');e.querySelectorAll('select,input').forEach(x=>x.disabled=sel.value!=='video')});
}

async function searchYoutube(q,page=1){
 q=(q||'').trim();if(!q)return;
 const d=await (await fetch('/api/search/youtube?q='+encodeURIComponent(q)+'&page='+page+'&limit=10')).json();
 const b=document.getElementById('results');b.innerHTML='<h3>YouTube results</h3>';
 if(d.error){b.innerHTML+='<div class="error">'+esc(d.error)+'</div>';return}
 for(const x of d.items||[]){
  const e=document.createElement('div');e.className='card track';
  e.innerHTML=(x.thumbnail?'<img src="'+esc(x.thumbnail)+'">':'')+'<div class="meta"><b>'+esc(x.title)+'</b><br>'+esc(x.channel)+' · '+dur(x.duration)+optionForm(x)+'</div>';
  b.appendChild(e);
 }
 const p=document.getElementById('youtubePagination');p.innerHTML=(d.page>1?'<button>← Prev</button> ':'')+'<span> Page '+(d.page||1)+' </span>'+(d.has_more?'<button>Next →</button>':'');
 const btns=p.querySelectorAll('button');if(d.page>1)btns[0].onclick=()=>searchYoutube(q,d.page-1);if(d.has_more)btns[btns.length-1].onclick=()=>searchYoutube(q,d.page+1);
}

function selectedQueue(){return [...document.querySelectorAll('.queue-check:checked')].map(x=>x.value)}
function toggleQueue(v){document.querySelectorAll('.queue-check').forEach(x=>x.checked=v);updateQueueSelection()}
function updateQueueSelection(){document.getElementById('queueSelected').textContent=selectedQueue().length+' selected'}
async function bulkQueue(action){const ids=selectedQueue();if(action==='clear_selected'&&!ids.length)return;const fd=new FormData();fd.append('action',action);fd.append('ids',ids.join(','));await fetch('/api/queue/bulk',{method:'POST',body:fd});load()}

let oldestFirst=false;
function sortCompleted(){oldestFirst=!oldestFirst;load()}
function selectedCompleted(){return [...document.querySelectorAll('.completed-check:checked')].map(x=>x.value)}
function toggleCompleted(v){document.querySelectorAll('.completed-check').forEach(x=>x.checked=v);updateCompletedSelection()}
function updateCompletedSelection(){document.getElementById('completedSelected').textContent=selectedCompleted().length+' selected'}
async function bulkCompleted(action){const ids=selectedCompleted();if(action==='clear_selected'&&!ids.length)return;const fd=new FormData();fd.append('action',action);fd.append('ids',ids.join(','));await fetch('/api/queue/bulk',{method:'POST',body:fd});load()}

function selectedSubscriptions(){return [...document.querySelectorAll('.subscription-check:checked')].map(x=>x.value)}
function toggleSubscriptions(v){document.querySelectorAll('.subscription-check').forEach(x=>x.checked=v)}
async function checkAllSubscriptions(){const d=await (await fetch('/api/playlists')).json();for(const p of d.items)if(p.enabled)await fetch('/api/playlists/'+encodeURIComponent(p.spotify_id)+'/sync-manual',{method:'POST'});load()}
async function checkSelectedSubscriptions(){for(const id of selectedSubscriptions())await fetch('/api/playlists/'+encodeURIComponent(id)+'/sync-manual',{method:'POST'});load()}
async function deleteSelectedSubscriptions(){const ids=selectedSubscriptions();if(!ids.length||!confirm('Delete selected subscriptions?'))return;for(const id of ids)await fetch('/api/playlists/'+encodeURIComponent(id),{method:'DELETE'});load()}

async function retry(id){await fetch('/api/retry/'+encodeURIComponent(id),{method:'POST'});load()}
async function pauseQueue(id){await fetch('/api/queue/'+encodeURIComponent(id)+'/pause',{method:'POST'});load()}
async function startQueue(id){await fetch('/api/queue/'+encodeURIComponent(id)+'/start',{method:'POST'});load()}
async function priorityQueue(id){await fetch('/api/queue/prioritize/'+encodeURIComponent(id),{method:'POST'});load()}
async function del(id){if(confirm('Delete this queue item?')){await fetch('/api/queue/'+encodeURIComponent(id),{method:'DELETE'});load()}}
function escAttr(s){return esc(s)}

async function load(){
 const d=await (await fetch('/api/jobs')).json(), q=document.getElementById('queue');
 const active=d.items.filter(x=>['downloading','queued','paused','pending_source','failed'].includes(x.status));
 document.getElementById('downloadingCount').textContent=active.length?' ('+active.length+')':'';
 q.innerHTML=active.map(x=>{
  const check='<input type="checkbox" class="queue-check" value="'+esc(x.spotify_id)+'" onchange="updateQueueSelection()">';
  const summary=(x.download_type||x.source_type||'audio')+' · '+(x.download_quality||'best')+' / '+(x.video_codec&&x.video_codec!=='auto'?x.video_codec+' / ':'')+(x.download_format||'');
  let actions='';
  if(x.status==='failed')actions='<button onclick="retry(\''+escAttr(x.spotify_id)+'\')">Retry</button><button onclick="del(\''+escAttr(x.spotify_id)+'\')">Delete</button>';
  else if(x.status==='queued')actions='<button onclick="pauseQueue(\''+escAttr(x.spotify_id)+'\')">Pause</button><button onclick="priorityQueue(\''+escAttr(x.spotify_id)+'\')">Move up</button><button onclick="del(\''+escAttr(x.spotify_id)+'\')">Delete</button>';
  else if(x.status==='paused')actions='<button onclick="startQueue(\''+escAttr(x.spotify_id)+'\')">Start</button><button onclick="priorityQueue(\''+escAttr(x.spotify_id)+'\')">Move up</button><button onclick="del(\''+escAttr(x.spotify_id)+'\')">Delete</button>';
  else if(x.status==='pending_source')actions='<button onclick="searchYoutube(\''+escAttr(x.title).replace(/'/g,"\\'")+' '+escAttr(x.artists).replace(/'/g,"\\'")+'\',1)">Find source</button>';
  return '<div class="item"><div>'+check+'</div><div><b>'+esc(x.title)+'</b><div class="muted">'+esc(x.artists||'')+'</div></div><div><span class="pill">'+esc(x.status)+'</span></div><div>'+esc(summary)+'</div><div><div class="barlabel"><span>'+Number(x.progress||0)+'%</span><span class="speed">'+esc(x.download_speed||'')+' '+(x.eta?'ETA '+esc(x.eta):'')+'</span></div><div class="progress"><div class="fill" style="width:'+Math.max(0,Math.min(100,Number(x.progress||0)))+'%"></div></div></div><div class="actions">'+actions+'</div></div>';
 }).join('')||'<p class="muted">Queue is empty.</p>';

 const h=await (await fetch('/api/history')).json(), hb=document.getElementById('history');
 const items=[...(h.items||[])].sort((a,b)=>oldestFirst?String(a.updated_at).localeCompare(String(b.updated_at)):String(b.updated_at).localeCompare(String(a.updated_at)));
 document.getElementById('completedCount').textContent=items.length?' ('+items.length+')':'';
 hb.innerHTML=items.map(x=>'<div class="item"><div><input type="checkbox" class="completed-check" value="'+esc(x.spotify_id)+'" onchange="updateCompletedSelection()"></div><div><b>'+esc(x.title)+'</b><div class="muted">'+esc(x.artists||'')+'</div></div><div><span class="pill '+(x.status==='failed'?'failed':'')+'">'+esc(x.status)+'</span></div><div>'+esc((x.download_quality||'best')+' / '+(x.video_codec&&x.video_codec!=='auto'?x.video_codec+' / ':'')+(x.download_format||''))+'</div><div>'+fmtBytes(x.total_bytes)+'</div><div>'+esc(x.updated_at||'')+'</div><div class="actions"><button onclick="retry(\''+esc(x.spotify_id)+'\')">Retry</button><button onclick="del(\''+esc(x.spotify_id)+'\')">Delete</button></div></div>').join('')||'<p class="muted">No history.</p>';

 const s=await (await fetch('/api/services')).json();
 document.getElementById('services').innerHTML='<span class="pill '+(s.worker.status==='online'?'online':'offline')+'">worker: '+esc(s.worker.status)+'</span><span class="pill '+(s.scheduler.status==='online'?'online':'offline')+'">scheduler: '+esc(s.scheduler.status)+'</span>';

 const sp=await (await fetch('/api/playlists')).json();
 document.getElementById('subscriptionsCount').textContent=sp.items.length?' ('+sp.items.length+')':'';
 document.getElementById('subscriptionsPanel').innerHTML=sp.items.map(p=>'<div class="subscription"><div><input type="checkbox" class="subscription-check" value="'+esc(p.spotify_id)+'"></div><div><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.url)+'</div></div><div><span class="pill">'+(p.enabled?'enabled':'disabled')+'</span></div><div class="muted">'+esc(p.last_sync||'never')+'</div><div class="actions"><button onclick="checkOneSubscription(\''+esc(p.spotify_id)+'\')">Check now</button><button onclick="togglePlaylist(\''+esc(p.spotify_id)+'\')">'+(p.enabled?'Disable':'Enable')+'</button><button onclick="deleteSubscription(\''+esc(p.spotify_id)+'\')">Delete</button></div></div>').join('')||'<p class="muted">No subscriptions.</p>';
 document.getElementById('playlists').innerHTML=sp.items.map(p=>'<div class="card"><b>'+esc(p.name)+'</b> · <span class="muted">'+esc(p.url)+'</span> <span class="pill">'+(p.enabled?'enabled':'disabled')+'</span></div>').join('');
}
async function checkOneSubscription(id){await fetch('/api/playlists/'+encodeURIComponent(id)+'/sync-manual',{method:'POST'});load()}
async function togglePlaylist(id){await fetch('/api/playlists/'+encodeURIComponent(id)+'/toggle',{method:'POST'});load()}
async function deleteSubscription(id){if(confirm('Remove this subscription?')){await fetch('/api/playlists/'+encodeURIComponent(id),{method:'DELETE'});load()}}

load();setInterval(load,5000);
</script>
</body>
</html>

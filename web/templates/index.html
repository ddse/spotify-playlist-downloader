<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music Downloader v3</title><style>body{font-family:system-ui;max-width:1200px;margin:auto;padding:18px;background:#111;color:#eee}input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #444}input{background:#1b1b1b;color:#fff;width:min(720px,100%)}button{cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}.card{padding:12px;margin:8px 0;background:#1b1b1b;border-radius:10px}.track{display:flex;gap:12px;align-items:center}.track img{width:64px;height:64px;object-fit:cover}.meta{flex:1}.muted{color:#aaa}.bar{height:8px;background:#444;border-radius:5px;margin-top:7px}.fill{height:100%;background:#aaa;border-radius:5px}.section{margin-top:28px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#333;margin:2px}.online{background:#244d2b}.offline{background:#512525}.hidden{display:none}pre{white-space:pre-wrap;max-height:240px;overflow:auto}.errorbox{border:1px solid #733;padding:8px;border-radius:8px;margin-top:8px}.copybtn{font-size:.85em;padding:5px 8px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.source{border-left:3px solid #777;padding-left:10px}.error{color:#ff9b9b}</style></head><body><h1>Music Downloader v3</h1><div class="row"><a href="/api/spotify/login"><button>Spotify Login / Connect</button></a><a href="/metube"><button>MeTube</button></a><span id="services"></span></div><div class="section"><h2>Search</h2><div class="row"><input id="q" placeholder="Song / artist / album"><button onclick="searchSpotify()">Spotify</button><button onclick="searchYoutube(document.getElementById('q').value,1)">YouTube</button></div><div id="results"></div><div id="youtubePagination" class="actions"></div></div><div class="section"><h2>Spotify Playlists</h2><form class="row" method="post" action="/api/playlists"><input name="url" placeholder="Spotify playlist URL" required><button>Add Playlist</button></form><div id="playlists"></div></div><div class="section"><h2>Queue</h2><div id="queue"></div></div><div class="section"><h2>History</h2><div id="history"></div></div><script>
function esc(s){return String(s??'').replace(/[&<>\\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}
function dur(s){if(!s)return '';s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
async function searchSpotify(){let q=document.getElementById('q').value.trim();if(!q)return;let d=await (await fetch('/api/search/spotify?q='+encodeURIComponent(q))).json();renderSpotify(d)}
function renderSpotify(d){let b=document.getElementById('results');b.innerHTML='<h3>Spotify metadata</h3>'+(d.error?`<div class="error">${esc(d.error)}</div>`:'');for(const x of d.items||[]){let e=document.createElement('div');e.className='card track';e.innerHTML=(x.image?`<img src="${esc(x.image)}">`:'')+`<div class="meta"><b>${esc(x.title)}</b><br>${esc(x.artists)} · ${esc(x.album)}</div><button onclick="searchYoutube('${esc(x.title).replace(/'/g,"\\'")} ${esc(x.artists).replace(/'/g,"\\'")}")">Find YouTube</button>`;b.appendChild(e)}}
async function searchYoutube(q,page=1){
 q=(q||'').trim();if(!q)return;
 let d=await (await fetch('/api/search/youtube?q='+encodeURIComponent(q)+'&page='+page+'&limit=10')).json();
 let b=document.getElementById('results');
 b.innerHTML='<h3>YouTube results</h3>'+(d.error?'<div class="error">'+esc(d.error)+'</div>':'');
 for(const x of d.items||[]){
  let e=document.createElement('div');e.className='card track';
  e.innerHTML=(x.thumbnail?'<img src="'+esc(x.thumbnail)+'">':'')+
   '<div class="meta"><b>'+esc(x.title)+'</b><br>'+esc(x.channel)+' · '+dur(x.duration)+'</div>'+
   '<div class="actions">'+
   '<form method="post" action="/api/download"><input type="hidden" name="source_url" value="'+esc(x.url)+'"><input type="hidden" name="youtube_id" value="'+esc(x.id)+'"><input type="hidden" name="title" value="'+esc(x.title)+'"><input type="hidden" name="artists" value="'+esc(x.channel)+'"><input type="hidden" name="download_type" value="audio"><button>Audio</button></form>'+
   '<form method="post" action="/api/download"><input type="hidden" name="source_url" value="'+esc(x.url)+'"><input type="hidden" name="youtube_id" value="'+esc(x.id)+'"><input type="hidden" name="title" value="'+esc(x.title)+'"><input type="hidden" name="artists" value="'+esc(x.channel)+'"><input type="hidden" name="download_type" value="video"><button>Video</button></form></div>';
  b.appendChild(e);
 }
 let p=document.getElementById('youtubePagination');
 p.innerHTML=(d.page>1?'<button onclick="searchYoutube('+JSON.stringify(q)+','+(d.page-1)+')">← Prev</button> ':'')+
  '<span> Page '+(d.page||1)+' </span>'+
  (d.has_more?'<button onclick="searchYoutube('+JSON.stringify(q)+','+(d.page+1)+')">Next →</button>':'');
}async function loadPlaylists(){let d=await (await fetch('/api/playlists')).json(),b=document.getElementById('playlists');b.innerHTML='';for(const p of d.items||[]){let e=document.createElement('div');e.className='card';e.innerHTML=`<b>${esc(p.name)}</b><br><span class="muted">${esc(p.url)} · last sync: ${esc(p.last_sync||'never')}</span><br><span class="pill">${p.enabled?'enabled':'disabled'}</span><div class="actions"><button onclick="syncPlaylist('${p.spotify_id}')">Sync metadata</button><button onclick="togglePlaylist('${p.spotify_id}')">${p.enabled?'Disable':'Enable'}</button><button onclick="deletePlaylist('${p.spotify_id}')">Delete</button></div>`;b.appendChild(e)}}
async function syncPlaylist(id){let r=await fetch('/api/playlists/'+id+'/sync-manual',{method:'POST'}),d=await r.json();alert(d.ok?'Added '+d.added+' metadata items. Select YouTube sources from search.':d.error);load()};async function togglePlaylist(id){await fetch('/api/playlists/'+id+'/toggle',{method:'POST'});load()};async function deletePlaylist(id){if(confirm('Remove this playlist from scheduler?')){await fetch('/api/playlists/'+id,{method:'DELETE'});load()}}
async function copyError(id){let e=document.getElementById('err-'+id);if(!e)return;try{await navigator.clipboard.writeText(e.textContent);event?.target&&(event.target.textContent='Copied');}catch(_){e.select?.();}}\nasync function load(){let d=await (await fetch('/api/jobs')).json(),b=document.getElementById('queue');let openErrors=new Set([...b.querySelectorAll('details[open][data-error-id]')].map(e=>e.dataset.errorId));b.innerHTML='';for(const x of d.items){let actions=x.status==='failed'?`<button onclick="retry('${x.spotify_id}')">Retry</button><button onclick="del('${x.spotify_id}')">Delete</button>`:(x.status==='queued'?`<button onclick="del('${x.spotify_id}')">Delete</button>`:'');let source=x.source_url?`<a href="${esc(x.source_url)}" target="_blank">source</a>`:'source not selected';let e=document.createElement('div');e.className='card';e.innerHTML=`<b>${esc(x.title)}</b> · ${esc(x.artists)}<br><span class="pill">${esc(x.status)}</span> ${x.progress}% · ${source}<div class="bar"><div class="fill" style="width:${x.progress}%"></div></div><div class="actions">${actions}${x.status==='pending_source'?`<button onclick="searchYoutube('${esc(x.title).replace(/'/g,"\\'")} ${esc(x.artists).replace(/'/g,"\\'")}")">Find source</button>`:''}</div>${x.error?`<details data-error-id="${esc(x.spotify_id)}" ${openErrors.has(x.spotify_id)?'open':''}><summary>Error</summary><div class="errorbox"><button class="copybtn" onclick="copyError('${esc(x.spotify_id)}')">Copy error</button><pre id="err-${esc(x.spotify_id)}">${esc(x.error)}</pre></div></details>`:''}`;b.appendChild(e)}let h=await (await fetch('/api/history')).json(),hb=document.getElementById('history');hb.innerHTML=h.items.map(x=>`<div class="card"><b>${esc(x.title)}</b> · ${esc(x.artists)}<br><span class="muted">${esc(x.status)} · ${esc(x.updated_at||'')}</span>${x.status==='failed'?`<div class="actions"><button onclick="retry('${x.spotify_id}')">Retry</button></div>`:''}${x.error?`<details><summary>Error</summary><div class="errorbox"><button class="copybtn" onclick="copyError('${esc(x.spotify_id)}')">Copy error</button><pre id="err-${esc(x.spotify_id)}">${esc(x.error)}</pre></div></details>`:''}</div>`).join('')||'<p class="muted">No history.</p>';let s=await (await fetch('/api/services')).json();document.getElementById('services').innerHTML=`<span class="pill ${s.worker.status==='online'?'online':'offline'}">worker: ${s.worker.status}</span><span class="pill ${s.scheduler.status==='online'?'online':'offline'}">scheduler: ${s.scheduler.status}</span>`;loadPlaylists()}
async function retry(id){await fetch('/api/retry/'+id,{method:'POST'});load()}async function del(id){if(confirm('Delete this queue item?')){await fetch('/api/queue/'+id,{method:'DELETE'});load()}}load();setInterval(load,5000);
</script></body></html>

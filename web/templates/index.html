<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music Downloader v3</title><style>body{font-family:system-ui;max-width:1200px;margin:auto;padding:18px;background:#111;color:#eee}input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #444}input{background:#1b1b1b;color:#fff;width:min(720px,100%)}button{cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}.card{padding:12px;margin:8px 0;background:#1b1b1b;border-radius:10px}.track{display:flex;gap:12px;align-items:center}.track img{width:64px;height:64px;object-fit:cover}.meta{flex:1}.muted{color:#aaa}.bar{height:8px;background:#444;border-radius:5px;margin-top:7px}.fill{height:100%;background:#aaa;border-radius:5px}.section{margin-top:28px}.subscriptions-toolbar{display:flex;gap:22px;align-items:center;padding:10px 8px;border-bottom:1px solid #333;flex-wrap:wrap}.downloading-toolbar{display:flex;gap:22px;align-items:center;padding:10px 8px;border-bottom:1px solid #333}.downloading-list{width:100%;overflow-x:auto}.downloading-head,.downloading-item{display:grid;grid-template-columns:36px minmax(220px,2fr) 90px minmax(180px,1fr) minmax(180px,1.5fr) 130px 150px;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #292929}.downloading-head{color:#aaa;font-size:.85em}.downloading-item .bar{margin-top:6px}.completed-toolbar{display:flex;gap:22px;align-items:center;padding:10px 8px;border-bottom:1px solid #333;flex-wrap:wrap}.toolbar-link{background:none;border:0;color:#9aa0a6;padding:0;font-size:.95rem;cursor:pointer}.toolbar-link:hover{color:#fff}.select-all{margin-left:auto;color:#aaa}.completed-table{width:100%;overflow-x:auto}.completed-row{display:grid;grid-template-columns:36px minmax(220px,2fr) 90px minmax(180px,1fr) 100px 150px 170px;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #292929}.completed-head{color:#aaa;font-size:.85em}.completed-row b{font-weight:500}.tabs{display:flex;gap:4px;border-bottom:1px solid #333;margin-top:22px}.tab{background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;color:#aaa}.tab.active{color:#fff;border-bottom-color:#fff}.panel{display:none}.panel.active{display:block}.speed{font-family:ui-monospace,monospace;color:#ddd}.eta{color:#aaa}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#333;margin:2px}.online{background:#244d2b}.offline{background:#512525}.hidden{display:none}pre{white-space:pre-wrap;max-height:240px;overflow:auto}.errorbox{border:1px solid #733;padding:8px;border-radius:8px;margin-top:8px}.copybtn{font-size:.85em;padding:5px 8px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.source{border-left:3px solid #777;padding-left:10px}.error{color:#ff9b9b}.downloadbox{background:#161616;border:1px solid #333;border-radius:10px;padding:10px;margin-top:8px}.downloadbox label{display:flex;flex-direction:column;gap:4px;font-size:.85em;color:#aaa}.downloadbox select{background:#1b1b1b;color:#fff;border:1px solid #444;border-radius:7px;padding:7px}.hidden{display:none}</style></head><body><h1>Music Downloader v3</h1><div class="row"><a href="/api/spotify/login"><button>Spotify Login / Connect</button></a><a href="/metube"><button>MeTube</button></a><span id="services"></span></div><div class="section"><h2>Search</h2><div class="row"><input id="q" placeholder="Song / artist / album"><button onclick="searchSpotify()">Spotify</button><button onclick="searchYoutube(document.getElementById('q').value,1)">YouTube</button></div><div id="results"></div><div id="youtubePagination" class="actions"></div></div><div class="section"><h2>YouTube Playlist / Channel</h2><form class="row" method="post" action="/api/import/youtube"><input name="source_url" placeholder="YouTube playlist or channel URL" required><select name="source_mode"><option value="playlist">Playlist</option><option value="channel">Channel</option></select><select name="download_type"><option value="audio">Audio</option><option value="video">Video</option></select><select name="download_format"><option value="mp3">MP3</option><option value="m4a">M4A</option><option value="opus">Opus</option><option value="mp4">MP4</option></select><select name="download_quality"><option value="best">Best</option><option value="320">320 kbps</option><option value="1080">1080p</option><option value="720">720p</option></select><input name="download_folder" value="YouTube" placeholder="Output folder"><input name="playlist_item_limit" type="number" min="0" max="5000" value="0" title="0 = all"><button>Queue import</button></form></div><div class="section"><h2>Spotify Playlists</h2><form class="row" method="post" action="/api/playlists"><input name="url" placeholder="Spotify playlist URL" required><button>Add Playlist</button></form><div id="playlists"></div></div><div class="tabs"><button class="tab active" onclick="showTab('downloading',this)">Downloading <span id="downloadingCount"></span></button><button class="tab" onclick="showTab('completed',this)">Completed <span id="completedCount"></span></button><button class="tab" onclick="showTab('subscriptions',this)">Subscriptions <span id="subscriptionsCount"></span></button></div><div id="downloading" class="panel active"><div class="downloading-toolbar"><button type="button" class="toolbar-link" onclick="cancelSelected()">🗑 Cancel selected</button><button type="button" class="toolbar-link" onclick="downloadSelected()">⇩ Download selected</button></div><div class="downloading-list"><div class="downloading-head"><span></span><span>Video</span><span>Type</span><span>Quality / Codec / Format</span><span>Progress</span><span>Speed / ETA</span><span></span></div><div id="queue"></div></div></div><div id="completed" class="panel"><div class="completed-toolbar"><button type="button" class="toolbar-link" onclick="sortCompleted()">↕ Oldest first</button><button type="button" class="toolbar-link" onclick="bulkCompleted('clear_selected')">🗑 Clear selected</button><button type="button" class="toolbar-link" onclick="bulkCompleted('clear_completed')">✓ Clear completed</button><button type="button" class="toolbar-link" onclick="bulkCompleted('clear_failed')">✕ Clear failed</button><button type="button" class="toolbar-link" onclick="bulkCompleted('retry_failed')">↻ Retry failed</button><button type="button" class="toolbar-link" onclick="bulkCompleted('download_selected')">⇩ Download Selected</button><label class="select-all"><input type="checkbox" id="selectAllCompleted" onchange="toggleCompleted(this.checked)"> Select all</label><span id="completedSelected">0 selected</span></div><div class="completed-table"><div class="completed-row completed-head"><div></div><div>Video</div><div>Type</div><div>Quality / Codec / Format</div><div>File Size</div><div>Downloaded</div><div></div></div><div id="history"></div></div></div><div id="subscriptions" class="panel"><div class="subscriptions-toolbar"><button type="button" class="toolbar-link" onclick="checkAllSubscriptions()">↻ Check all now</button><button type="button" class="toolbar-link" onclick="checkSelectedSubscriptions()">↻ Check selected</button><button type="button" class="toolbar-link" onclick="deleteSelectedSubscriptions()">🗑 Delete selected</button><label class="select-all"><input type="checkbox" id="selectAllSubscriptions" onchange="toggleSubscriptions(this.checked)"> Select all</label></div><div id="subscriptionsPanel"></div></div><script>
function esc(s){return String(s??'').replace(/[&<>\\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}
function dur(s){if(!s)return '';s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
async function searchSpotify(){let q=document.getElementById('q').value.trim();if(!q)return;let d=await (await fetch('/api/search/spotify?q='+encodeURIComponent(q))).json();renderSpotify(d)}
function renderSpotify(d){let b=document.getElementById('results');b.innerHTML='<h3>Spotify metadata</h3>'+(d.error?`<div class="error">${esc(d.error)}</div>`:'');for(const x of d.items||[]){let e=document.createElement('div');e.className='card track';e.innerHTML=(x.image?`<img src="${esc(x.image)}">`:'')+`<div class="meta"><b>${esc(x.title)}</b><br>${esc(x.artists)} · ${esc(x.album)}</div><button onclick="searchYoutube('${esc(x.title).replace(/'/g,"\\'")} ${esc(x.artists).replace(/'/g,"\\'")}")">Find YouTube</button>`;b.appendChild(e)}}
function syncDownloadOptions(sel){let f=sel.closest('form');f.querySelectorAll('.audio-opt').forEach(e=>{e.classList.toggle('hidden',sel.value!=='audio');e.querySelectorAll('select').forEach(x=>x.disabled=sel.value!=='audio')});f.querySelectorAll('.video-opt').forEach(e=>{e.classList.toggle('hidden',sel.value!=='video');e.querySelectorAll('select').forEach(x=>x.disabled=sel.value!=='video')})}async function searchYoutube(q,page=1){
 q=(q||'').trim();if(!q)return;
 let d=await (await fetch('/api/search/youtube?q='+encodeURIComponent(q)+'&page='+page+'&limit=10')).json();
 let b=document.getElementById('results');
 b.innerHTML='<h3>YouTube results</h3>'+(d.error?'<div class="error">'+esc(d.error)+'</div>':'');
 for(const x of d.items||[]){
  let e=document.createElement('div');e.className='card track';
  e.innerHTML=(x.thumbnail?'<img src="'+esc(x.thumbnail)+'">':'')+
   '<div class="meta"><b>'+esc(x.title)+'</b><br>'+esc(x.channel)+' · '+dur(x.duration)+'</div>'+
   '<details class="downloadbox"><summary>Download options</summary>'+
   '<form method="post" action="/api/download" class="actions" style="align-items:end">'+
   '<input type="hidden" name="source_url" value="'+esc(x.url)+'"><input type="hidden" name="youtube_id" value="'+esc(x.id)+'"><input type="hidden" name="title" value="'+esc(x.title)+'"><input type="hidden" name="artists" value="'+esc(x.channel)+'">'+
   '<label>Type<select name="download_type" onchange="syncDownloadOptions(this)"><option value="audio">Audio</option><option value="video">Video</option></select></label>'+
   '<label class="audio-opt">Format<select name="download_format"><option>mp3</option><option>m4a</option><option>opus</option><option>wav</option><option>flac</option></select></label>'+
   '<label class="audio-opt">Quality<select name="download_quality"><option value="320">320 kbps</option><option value="256">256 kbps</option><option value="192">192 kbps</option><option value="128">128 kbps</option><option value="best">Best</option></select></label>'+
   '<label class="video-opt hidden">Format<select name="download_format"><option value="any">Any</option><option value="mp4">MP4</option><option value="ios">iOS</option></select></label>'+
   '<label class="video-opt hidden">Quality<select name="download_quality"><option value="best">Best</option><option>2160</option><option>1440</option><option>1080</option><option>720</option><option>480</option><option>360</option></select></label>'+
   '<label class="video-opt hidden">Codec<select name="video_codec"><option value="auto">Auto</option><option value="h264">H.264</option><option value="h265">H.265</option><option value="av1">AV1</option><option value="vp9">VP9</option></select></label>'+
   '<label>Folder<select name="download_folder"><option value="">Artist / Album</option><option value="Music">Music</option><option value="YouTube">YouTube</option><option value="Videos">Videos</option></select></label>'+
   '<label><span>Thumbnail</span><input type="checkbox" name="thumbnail" value="1" checked></label>'+
   '<label class="video-opt hidden"><span>Subtitle</span><input type="checkbox" name="subtitle" value="1"></label>'+
   '<label class="video-opt hidden">Subtitle languages<input name="subtitle_lang" value="ja,en" size="10"></label>'+
   '<label class="video-opt hidden">Subtitle mode<select name="subtitle_mode"><option value="prefer_manual">Manual preferred</option><option value="prefer_auto">Auto preferred</option><option value="manual_only">Manual only</option><option value="auto_only">Auto only</option></select></label>'+
   '<label class="video-opt hidden"><span>Split chapters</span><input type="checkbox" name="split_chapters" value="1"></label>'+
   '<label>Start<select name="auto_start"><option value="1">Now</option><option value="0">Pause</option></select></label>'+
   '<button>Download</button></form></details>';
  b.appendChild(e);
 }
 let p=document.getElementById('youtubePagination');
 p.innerHTML=(d.page>1?'<button onclick="searchYoutube('+JSON.stringify(q)+','+(d.page-1)+')">← Prev</button> ':'')+
  '<span> Page '+(d.page||1)+' </span>'+
  (d.has_more?'<button onclick="searchYoutube('+JSON.stringify(q)+','+(d.page+1)+')">Next →</button>':'');
}async function loadPlaylists(){let d=await (await fetch('/api/playlists')).json(),b=document.getElementById('playlists');b.innerHTML='';for(const p of d.items||[]){let e=document.createElement('div');e.className='card';e.innerHTML=`<b>${esc(p.name)}</b><br><span class="muted">${esc(p.url)} · last sync: ${esc(p.last_sync||'never')}</span><br><span class="pill">${p.enabled?'enabled':'disabled'}</span><div class="actions"><button onclick="syncPlaylist('${p.spotify_id}')">Sync metadata</button><button onclick="togglePlaylist('${p.spotify_id}')">${p.enabled?'Disable':'Enable'}</button><button onclick="deletePlaylist('${p.spotify_id}')">Delete</button></div>`;b.appendChild(e)}}
async function syncPlaylist(id){let r=await fetch('/api/playlists/'+id+'/sync-manual',{method:'POST'}),d=await r.json();alert(d.ok?'Added '+d.added+' metadata items. Select YouTube sources from search.':d.error);load()};async function togglePlaylist(id){await fetch('/api/playlists/'+id+'/toggle',{method:'POST'});load()};async function deletePlaylist(id){if(confirm('Remove this playlist from scheduler?')){await fetch('/api/playlists/'+id,{method:'DELETE'});load()}}
async function copyError(id){let e=document.getElementById('err-'+id);if(!e)return;try{await navigator.clipboard.writeText(e.textContent);event?.target&&(event.target.textContent='Copied');}catch(_){e.select?.();}}\nfunction showTab(id,btn){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');btn.classList.add('active')}async function load(){let d=await (await fetch('/api/jobs')).json(),b=document.getElementById('queue');let openErrors=new Set([...b.querySelectorAll('details[open][data-error-id]')].map(e=>e.dataset.errorId));b.innerHTML='';let active=d.items.filter(x=>['downloading','queued','paused','pending_source','failed'].includes(x.status));document.getElementById('downloadingCount').textContent=active.length?' ('+active.length+')':'';for(const x of active){let optionSummary=x.download_type?`<span class="pill">${esc(x.download_type)} · ${esc(x.download_format||'')} · ${esc(x.download_quality||'')}</span>`:'';let actions=x.status==='failed'?`<button onclick="retry('${x.spotify_id}')">Retry</button><button onclick="del('${x.spotify_id}')">Delete</button>`:(x.status==='queued'?`<button onclick="pauseQueue('${x.spotify_id}')">Pause</button><button onclick="priorityQueue('${x.spotify_id}')">Move up</button><button onclick="del('${x.spotify_id}')">Delete</button>`:(x.status==='paused'?`<button onclick="startQueue('${x.spotify_id}')">Start</button><button onclick="priorityQueue('${x.spotify_id}')">Move up</button><button onclick="del('${x.spotify_id}')">Delete</button>`:''));let source=x.source_url?`<a href="${esc(x.source_url)}" target="_blank">source</a>`:'source not selected';let e=document.createElement('div');e.className='card';e.innerHTML=`<b>${esc(x.title)}</b> · ${esc(x.artists)}<br><span class="pill">${esc(x.status)}</span> ${x.progress}% · ${source}${x.status==='downloading'&&x.download_speed?` <span class="speed">${esc(x.download_speed)}</span>${x.eta?` <span class="eta">ETA ${esc(x.eta)}</span>`:''}`:''}<div class="bar"><div class="fill" style="width:${x.progress}%"></div></div><div class="actions">${actions}${x.status==='pending_source'?`<button onclick="searchYoutube('${esc(x.title).replace(/'/g,"\\'")} ${esc(x.artists).replace(/'/g,"\\'")}")">Find source</button>`:''}</div>${x.error?`<details data-error-id="${esc(x.spotify_id)}" ${openErrors.has(x.spotify_id)?'open':''}><summary>Error</summary><div class="errorbox"><button class="copybtn" onclick="copyError('${esc(x.spotify_id)}')">Copy error</button><pre id="err-${esc(x.spotify_id)}">${esc(x.error)}</pre></div></details>`:''}`;b.appendChild(e)}let h=await (await fetch('/api/history')).json(),hb=document.getElementById('history');document.getElementById('completedCount').textContent=h.items.length?' ('+h.items.length+')':'';hb.innerHTML=h.items.map(x=>{let size=x.total_bytes?formatBytes(x.total_bytes):'—';let q=x.download_quality||'best';let cf=(x.video_codec&&x.video_codec!=='auto'?x.video_codec+' / ':'')+(x.download_format||'');return '<div class="completed-row"><div><input type="checkbox" class="completed-check" value="'+esc(x.spotify_id)+'" onchange="updateCompletedSelection()"></div><div><b>'+esc(x.title)+'</b><div class="muted">'+esc(x.artists||'')+'</div></div><div>'+esc(x.download_type||'audio')+'</div><div>'+esc(q)+' / '+esc(cf)+'</div><div>'+size+'</div><div>'+esc(x.updated_at||'')+'</div><div class="actions"><button onclick="retry(\''+esc(x.spotify_id)+'\')">Retry</button><button onclick="del(\''+esc(x.spotify_id)+'\')">Delete</button></div></div>'}).join('')(x=>`<div class="card"><b>${esc(x.title)}</b> · ${esc(x.artists)}<br><span class="muted">${esc(x.status)} · ${esc(x.updated_at||'')}</span>${x.status==='failed'?`<div class="actions"><button onclick="retry('${x.spotify_id}')">Retry</button></div>`:''}${x.error?`<details><summary>Error</summary><div class="errorbox"><button class="copybtn" onclick="copyError('${esc(x.spotify_id)}')">Copy error</button><pre id="err-${esc(x.spotify_id)}">${esc(x.error)}</pre></div></details>`:''}</div>`).join('')||'<p class="muted">No history.</p>';let s=await (await fetch('/api/services')).json();document.getElementById('services').innerHTML=`<span class="pill ${s.worker.status==='online'?'online':'offline'}">worker: ${s.worker.status}</span><span class="pill ${s.scheduler.status==='online'?'online':'offline'}">scheduler: ${s.scheduler.status}</span>`;let sp=await (await fetch('/api/playlists')).json();document.getElementById('subscriptionsCount').textContent=sp.items.length?' ('+sp.items.length+')':'';document.getElementById('subscriptionsPanel').innerHTML=sp.items.map(p=>`<div class="subscription-row"><input type="checkbox" class="subscription-check" value="${esc(p.spotify_id)}"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.url)}</div></div><span class="pill">${p.enabled?'enabled':'disabled'}</span><span class="muted">${esc(p.updated_at||'')}</span><div class="actions"><button onclick="syncPlaylist('${p.spotify_id}')">Check now</button><button onclick="togglePlaylist('${p.spotify_id}')">${p.enabled?'Disable':'Enable'}</button><button onclick="deletePlaylist('${p.spotify_id}')">Delete</button></div></div>`).join('')||'<p class="muted">No subscriptions.</p>';loadPlaylists()}
let completedOldestFirst=true;function sortCompleted(){completedOldestFirst=!completedOldestFirst;load()}async function bulkCompleted(action){let ids=[...document.querySelectorAll('.completed-check:checked')].map(x=>x.value);if(action==='clear_selected'&&!ids.length)return;let fd=new FormData();fd.append('action',action);fd.append('ids',ids.join(','));await fetch('/api/queue/bulk',{method:'POST',body:fd});load()}function selectedSubscriptions(){return [...document.querySelectorAll('.subscription-check:checked')].map(x=>x.value)}function toggleSubscriptions(v){document.querySelectorAll('.subscription-check').forEach(x=>x.checked=v)}async function checkAllSubscriptions(){let sp=await (await fetch('/api/playlists')).json();for(const p of sp.items)if(p.enabled)await fetch('/api/playlists/'+encodeURIComponent(p.spotify_id)+'/sync',{method:'POST'});load()}async function checkSelectedSubscriptions(){for(const id of selectedSubscriptions())await fetch('/api/playlists/'+encodeURIComponent(id)+'/sync',{method:'POST'});load()}async function deleteSelectedSubscriptions(){for(const id of selectedSubscriptions())await fetch('/api/playlists/'+encodeURIComponent(id)+'/toggle',{method:'POST'});load()}function selectedDownloading(){return [...document.querySelectorAll('.downloading-check:checked')].map(x=>x.value)}async function cancelSelected(){let ids=selectedDownloading();if(!ids.length)return;let fd=new FormData();fd.append('action','clear_selected');fd.append('ids',ids.join(','));await fetch('/api/queue/bulk',{method:'POST',body:fd});load()}async function downloadSelected(){let ids=selectedDownloading();if(!ids.length)return;let fd=new FormData();fd.append('action','download_selected');fd.append('ids',ids.join(','));await fetch('/api/queue/bulk',{method:'POST',body:fd});load()}function formatBytes(n){n=Number(n||0);if(!n)return '—';let u=['B','KiB','MiB','GiB'];let i=0;while(n>=1024&&i<3){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]}function toggleCompleted(v){document.querySelectorAll('.completed-check').forEach(x=>x.checked=v);updateCompletedSelection()}function updateCompletedSelection(){let n=document.querySelectorAll('.completed-check:checked').length;document.getElementById('completedSelected').textContent=n+' selected'}function selectedCompleted(){return [...document.querySelectorAll('.completed-check:checked')].map(x=>x.value)}async function downloadSelectedCompleted(){for(const id of selectedCompleted()){let x=await fetch('/api/history/'+encodeURIComponent(id)+'/download',{method:'POST'});if(!x.ok)console.error(await x.text())}load()}async function deleteSelectedCompleted(){for(const id of selectedCompleted())await fetch('/api/delete/'+encodeURIComponent(id),{method:'POST'});load()}async function retry(id){await fetch('/api/retry/'+id,{method:'POST'});load()}async function pauseQueue(id){await fetch('/api/queue/'+id+'/pause',{method:'POST'});load()}async function startQueue(id){await fetch('/api/queue/'+id+'/start',{method:'POST'});load()}async function priorityQueue(id){await fetch('/api/queue/prioritize/'+id,{method:'POST'});load()}async function del(id){if(confirm('Delete this queue item?')){await fetch('/api/queue/'+id,{method:'DELETE'});load()}}load();setInterval(load,5000);
</script></body></html>

name: PR Review Checks

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run validation
        run: |
          python -m compileall -q database.py web worker
          cd web && npm install && npm run build
      - name: Review checklist
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '### Automated PR review',
              '',
              '- Python syntax check: passed',
              '- Frontend build: passed',
              '- Docker/Compose changes should be verified by the CI workflow.',
              '- Secrets/private WireGuard configuration must not be committed.',
              '',
              'For AI code review, enable GitHub Copilot automatic code review for this repository.'
            ].join('\n');
            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number
            });
            const marker = '### Automated PR review';
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body
              });
            }
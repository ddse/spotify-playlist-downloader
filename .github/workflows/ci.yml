name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m compileall -q database.py web worker
      - name: Frontend build
        working-directory: web
        run: |
          npm install
          npm run build
      - name: Docker Compose validation
        run: docker compose config
name: CI

# Feature branch conflict resolution validation
# provider schema syntax fixed
# dependencies installed before test suites
# provider path isolation fixed
# provider API routes restored
# database import restored/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

# Every push and every PR targeting main gets its own CI run.
# Do not cancel an in-flight run when another commit is pushed: each commit
# must be independently validated before it can be considered mergeable.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Full validation
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r web/requirements.txt pytest requests==2.32.5
          pip install "yt-dlp[default]"

      - name: Python syntax
        run: python -m compileall -q database.py web worker tests

      - name: Python automation tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Download output resolution tests
        run: python -m pytest -q tests/test_download_output.py
      - name: Provider pytest suite
        run: python -m pytest -q -m "not live"
      - name: Zing MP3 live integration - search
        run: python scripts/test_zing_search.py

      - name: Zing MP3 live integration - download
        run: python scripts/test_zing_download.py

      - name: Frontend build
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Prepare CI environment
        run: touch .env

      - name: Docker Compose validation
        run: docker compose config

      - name: Build all Docker services
        run: docker compose build --pull

      - name: Integration smoke test
        run: |
          docker compose up -d --wait
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:8088/health
          docker compose ps
          docker compose down -v

  publish:
    name: Publish Docker images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          echo "web=ghcr.io/${GITHUB_REPOSITORY,,}-web:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "worker=ghcr.io/${GITHUB_REPOSITORY,,}-worker:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "web_latest=ghcr.io/${GITHUB_REPOSITORY,,}-web:latest" >> "$GITHUB_OUTPUT"
          echo "worker_latest=ghcr.io/${GITHUB_REPOSITORY,,}-worker:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.web }}
            ${{ steps.meta.outputs.web_latest }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.worker }}
            ${{ steps.meta.outputs.worker_latest }}

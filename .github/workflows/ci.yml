name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r web/requirements.txt pytest
          pip install "yt-dlp[default]"
      - name: Python compile check
        run: |
          python -m py_compile database.py web/app.py web/spotify.py web/youtube.py
          python -m py_compile worker/worker.py worker/search.py worker/providers/*.py
      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install dependencies
        working-directory: web
        run: npm install
      - name: Build frontend
        working-directory: web
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [python-tests, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build web image
        run: docker build -f web/Dockerfile -t spotify-downloader-web:test .
      - name: Build worker image
        run: docker build -f worker/Dockerfile -t spotify-downloader-worker:test .
